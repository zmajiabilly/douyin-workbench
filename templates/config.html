<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配置 - 抖音工作台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f13; color: #e4e4e7; min-height: 100vh; }
.header { background: #1a1a23; border-bottom: 1px solid #2a2a35; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
.header h1 { font-size: 18px; font-weight: 600; color: #fff; }
.header a { color: #a1a1aa; text-decoration: none; font-size: 14px; }
.header a:hover { color: #fff; }
.container { max-width: 640px; margin: 24px auto; padding: 0 20px; }
.card { background: #1a1a23; border: 1px solid #2a2a35; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.card p { font-size: 12px; color: #71717a; margin-bottom: 12px; }
label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 4px; margin-top: 12px; }
label:first-child { margin-top: 0; }
input, select { width: 100%; padding: 10px 12px; background: #0f0f13; border: 1px solid #2a2a35; border-radius: 6px; color: #e4e4e7; font-size: 14px; outline: none; }
input:focus { border-color: #ea580c; }
select { cursor: pointer; }
.hint { font-size: 11px; color: #52525b; margin-top: 4px; }
.btn-save { padding: 10px 24px; background: #ea580c; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: .2s; display: block; margin-top: 20px; }
.btn-save:hover { background: #d97706; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a23; border: 1px solid #2a2a35; border-radius: 8px; padding: 12px 20px; font-size: 14px; display: none; z-index: 999; }
.toast.show { display: block; }
.divider { border: none; border-top: 1px solid #2a2a35; margin: 16px 0; }
</style>
</head>
<body>

<div class="header">
  <a href="/">← 返回</a>
  <h1>⚙ 配置</h1>
</div>

<div class="container">
  <form id="configForm">
    <!-- 大模型提供商 -->
    <div class="card">
      <h3>🤖 大模型</h3>
      <p>全部走云端大模型，填一个 API Key 即可使用。推荐 SiliconFlow（免费额度多）。</p>
      
      <label>提供商</label>
      <select id="llm_provider" onchange="toggleProvider()">
        <option value="siliconflow">SiliconFlow（推荐）</option>
        <option value="openai">OpenAI</option>
      </select>

      <div id="cloudConfig">
        <label>API Key</label>
        <input id="cloud_api_key" type="password" placeholder="sk-xxx">
        <div class="hint">免费获取：https://cloud.siliconflow.cn → 注册 → 创建 API Key</div>
      </div>
      <div id="modelConfig" style="margin-top:12px; display:none;">
        <label>文本模型</label>
        <input id="text_model" placeholder="Qwen/Qwen3-8B">
        <label>视觉模型</label>
        <input id="vision_model" placeholder="Qwen/Qwen2.5-VL-7B-Instruct">
      </div>
    </div>

    <!-- 语音识别 -->
    <div class="card">
      <h3>🎤 语音识别（ASR）</h3>
      <p>将视频中的口播转写为文字。默认用 SiliconFlow SenseVoice，和新用户免费额度。</p>
      <label>API Key</label>
      <input id="asr_api_key" type="password" placeholder="sk-xxx">
      <div class="hint">和大模型用同一个 Key 即可</div>
    </div>

    <button type="button" class="btn-save" onclick="saveConfig()">💾 保存配置</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const initialConfig = {{ config | tojson | safe }};

function loadConfig() {
  const llm = initialConfig.llm || {};
  const asr = initialConfig.asr || {};
  
  document.getElementById('llm_provider').value = llm.provider || 'siliconflow';
  document.getElementById('cloud_api_key').value = llm.siliconflow_api_key || '';
  document.getElementById('text_model').value = llm.siliconflow_text_model || 'Qwen/Qwen3-8B';
  document.getElementById('vision_model').value = llm.siliconflow_vision_model || 'Qwen/Qwen2.5-VL-7B-Instruct';
  document.getElementById('asr_api_key').value = asr.siliconflow_api_key || llm.siliconflow_api_key || '';
  
  toggleProvider();
}

function toggleProvider() {
  const v = document.getElementById('llm_provider').value;
  document.getElementById('cloudConfig').style.display = 'block';
  document.getElementById('modelConfig').style.display = 'none';
}

async function saveConfig() {
  const provider = document.getElementById('llm_provider').value;
  const payload = {
    llm: {
      provider: provider,
      siliconflow_api_key: document.getElementById('cloud_api_key').value,
      siliconflow_text_model: document.getElementById('text_model').value,
      siliconflow_vision_model: document.getElementById('vision_model').value,
      openai_api_key: provider === 'openai' ? document.getElementById('cloud_api_key').value : '',
      openai_text_model: 'gpt-4o-mini',
      openai_vision_model: 'gpt-4o-mini'
    },
    asr: {
      siliconflow_api_key: document.getElementById('asr_api_key').value
    }
  };

  try {
    const resp = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (data.status === 'ok') {
      showToast('✅ 配置已保存');
    }
  } catch (e) {
    showToast('❌ 保存失败: ' + e.message);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadConfig();
</script>
</body>
</html>
