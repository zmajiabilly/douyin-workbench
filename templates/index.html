<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音工作台</title>
<style>
/* ── Reset & Base ──────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: #0f0f13;
  color: #e0e0e0;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

/* ── Top Bar ────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: #1a1a23;
  border-bottom: 1px solid #2a2a35;
}
.topbar h1 { font-size: 18px; font-weight: 600; color: #ea580c; }
.topbar .config-btn {
  background: #2a2a35; border: 1px solid #3a3a45; color: #ccc;
  padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
}
.topbar .config-btn:hover { background: #3a3a45; }

/* ── Tab Bar ────────────────────────────────── */
.tab-bar {
  display: flex; gap: 0;
  border-bottom: 1px solid #2a2a35;
  background: #14141e;
  padding: 0 24px;
}
.tab-btn {
  padding: 12px 24px; cursor: pointer; font-size: 14px;
  color: #888; border-bottom: 2px solid transparent;
  transition: all .2s; background: none; border-top: none;
  border-left: none; border-right: none;
}
.tab-btn:hover { color: #ccc; }
.tab-btn.active { color: #ea580c; border-bottom-color: #ea580c; }

/* ── Content ────────────────────────────────── */
.tab-content { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
.tab-content.active { display: block; }

/* ── Process Tab ────────────────────────────── */
.process-form {
  display: flex; gap: 8px; margin-bottom: 16px;
}
.process-form input[type="text"] {
  flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #2a2a35;
  background: #1a1a23; color: #e0e0e0; font-size: 14px; outline: none;
}
.process-form input[type="text"]:focus { border-color: #ea580c; }
.process-form button {
  padding: 10px 24px; border-radius: 6px; border: none;
  background: #ea580c; color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.process-form button:hover { background: #d24d0a; }
.process-form button:disabled { opacity: .5; cursor: not-allowed; }

.process-options {
  display: flex; gap: 20px; margin-bottom: 20px; font-size: 14px; color: #aaa;
}
.process-options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.process-options input[type="checkbox"] {
  accent-color: #ea580c; width: 16px; height: 16px;
}

/* ── Progress ───────────────────────────────── */
.progress-area {
  display: none; padding: 16px; margin-bottom: 20px;
  background: #1a1a23; border: 1px solid #2a2a35; border-radius: 8px;
}
.progress-area.visible { display: block; }
.progress-text {
  font-size: 14px; color: #ea580c;
}
.progress-bar {
  margin-top: 10px; height: 4px; background: #2a2a35; border-radius: 2px; overflow: hidden;
}
.progress-bar-inner {
  height: 100%; width: 0; background: #ea580c; border-radius: 2px;
  transition: width .3s;
}

/* ── Result Card ───────────────────────────── */
.result-card {
  display: none; background: #1a1a23; border: 1px solid #2a2a35; border-radius: 8px;
  overflow: hidden;
}
.result-card.visible { display: block; }
.result-card .card-header {
  padding: 16px 20px; border-bottom: 1px solid #2a2a35;
}
.result-card .card-title {
  font-size: 16px; font-weight: 600; margin-bottom: 4px;
}
.result-card .card-meta { font-size: 13px; color: #888; }

.result-card .card-tabs {
  display: flex; gap: 0; border-bottom: 1px solid #2a2a35;
}
.result-card .card-tab {
  padding: 10px 20px; cursor: pointer; font-size: 13px; color: #888;
  border-bottom: 2px solid transparent; transition: all .2s; background: none;
  border-top: none; border-left: none; border-right: none;
}
.result-card .card-tab:hover { color: #ccc; }
.result-card .card-tab.active { color: #ea580c; border-bottom-color: #ea580c; }

.result-card .card-body { padding: 20px; }
.result-card .card-pane { display: none; }
.result-card .card-pane.active { display: block; }

.video-player { width: 100%; max-height: 500px; border-radius: 6px; }
.text-content {
  font-size: 14px; line-height: 1.7; color: #ccc;
  white-space: pre-wrap; max-height: 500px; overflow-y: auto;
}
.cover-image { max-width: 100%; max-height: 400px; border-radius: 6px; margin-bottom: 12px; }

/* ── History Tab ────────────────────────────── */
.history-toolbar {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  gap: 12px; flex-wrap: wrap;
}
.history-toolbar .search-box {
  flex: 1; min-width: 200px;
  padding: 8px 12px; border-radius: 6px; border: 1px solid #2a2a35;
  background: #1a1a23; color: #e0e0e0; font-size: 14px; outline: none;
}
.history-toolbar .search-box:focus { border-color: #ea580c; }
.history-toolbar .export-btn {
  padding: 8px 18px; border-radius: 6px; border: none;
  background: #2a2a35; color: #ccc; font-size: 13px; cursor: pointer;
  white-space: nowrap;
}
.history-toolbar .export-btn:hover { background: #3a3a45; }

.table-wrap { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
thead th {
  background: #1a1a23; padding: 10px 12px; text-align: left;
  border-bottom: 2px solid #2a2a35; color: #888; font-weight: 600;
  white-space: nowrap; cursor: pointer; user-select: none;
}
thead th:hover { color: #ccc; }
thead th .sort-icon { margin-left: 4px; font-size: 10px; opacity: .5; }
thead th .sort-icon.active { opacity: 1; color: #ea580c; }
tbody tr { border-bottom: 1px solid #1e1e2a; }
tbody tr:hover { background: #191924; }
tbody td { padding: 10px 12px; vertical-align: top; }
td .clickable { color: #ea580c; cursor: pointer; }
td .clickable:hover { text-decoration: underline; }
td .link { color: #6ba0ff; cursor: pointer; }
td .link:hover { text-decoration: underline; }
td .actions { display: flex; gap: 6px; flex-wrap: nowrap; }
td .actions button {
  padding: 4px 10px; border-radius: 4px; border: none; font-size: 12px; cursor: pointer;
}
.btn-play { background: #2a2a35; color: #ccc; }
.btn-play:hover { background: #3a3a45; }
.btn-del { background: #3a1a1a; color: #e55; }
.btn-del:hover { background: #4a2020; }
.full-btn {
  background: none; border: none; color: #ea580c; cursor: pointer; font-size: 12px; padding: 0 4px;
}
.full-btn:hover { text-decoration: underline; }
.no-records { text-align: center; padding: 40px; color: #555; font-size: 14px; }

/* ── Modal ──────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.6); justify-content: center; align-items: center;
}
.modal-overlay.visible { display: flex; }
.modal-box {
  background: #1a1a23; border: 1px solid #2a2a35; border-radius: 10px;
  width: 90%; max-width: 720px; max-height: 85vh;
  display: flex; flex-direction: column;
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid #2a2a35;
}
.modal-head h2 { font-size: 16px; font-weight: 600; }
.modal-close {
  background: none; border: none; color: #888; font-size: 20px; cursor: pointer; padding: 4px;
}
.modal-close:hover { color: #fff; }
.modal-body {
  padding: 20px; overflow-y: auto; flex: 1;
  font-size: 14px; line-height: 1.7; white-space: pre-wrap;
}
.modal-body video { width: 100%; max-height: 500px; border-radius: 6px; }
.modal-body img { max-width: 100%; border-radius: 6px; }

/* ── Toast ──────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #2a2a35; border: 1px solid #3a3a45; color: #e0e0e0;
  padding: 10px 24px; border-radius: 8px; font-size: 14px;
  z-index: 2000; display: none; max-width: 90%;
}
.toast.error { border-color: #e55; color: #e55; }
.toast.success { border-color: #4a4; color: #4a4; }
</style>
</head>
<body>

<!-- ── Top Bar ───────────────────────────── -->
<div class="topbar">
  <h1>📱 抖音工作台</h1>
  <button class="config-btn" onclick="location.href='/config'">⚙ 配置</button>
</div>

<!-- ── Tab Bar ────────────────────────────── -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="process" onclick="switchTab('process')">处理新链接</button>
  <button class="tab-btn" data-tab="history" onclick="switchTab('history')">📋 下载记录</button>
</div>

<!-- ── Tab: Process ───────────────────────── -->
<div id="tab-process" class="tab-content active">
  <div class="process-form">
    <input type="text" id="url-input" placeholder="粘贴抖音链接 https://v.douyin.com/xxx" autocomplete="url">
    <button id="btn-process" onclick="startProcess()">开始处理</button>
  </div>

  <div class="process-options">
    <label><input type="checkbox" id="chk-asr" checked> 转写文案</label>
    <label><input type="checkbox" id="chk-summary" checked> AI 总结</label>
  </div>

  <div class="progress-area" id="progress-area">
    <div class="progress-text" id="progress-text">正在解析链接…</div>
    <div class="progress-bar"><div class="progress-bar-inner" id="progress-bar-inner"></div></div>
  </div>

  <div class="result-card" id="result-card">
    <div class="card-header">
      <div class="card-title" id="result-title"></div>
      <div class="card-meta" id="result-meta"></div>
    </div>
    <div class="card-tabs" id="card-tabs">
      <button class="card-tab active" data-pane="video" onclick="switchCardTab('video')">视频</button>
      <button class="card-tab" data-pane="transcript" onclick="switchCardTab('transcript')">完整文案</button>
      <button class="card-tab" data-pane="summary" onclick="switchCardTab('summary')">AI总结</button>
      <button class="card-tab" data-pane="cover" onclick="switchCardTab('cover')">封面分析</button>
    </div>
    <div class="card-body">
      <div class="card-pane active" id="pane-video">
        <video class="video-player" id="result-video" controls></video>
      </div>
      <div class="card-pane" id="pane-transcript">
        <div class="text-content" id="result-transcript"></div>
      </div>
      <div class="card-pane" id="pane-summary">
        <div class="text-content" id="result-summary"></div>
      </div>
      <div class="card-pane" id="pane-cover">
        <img class="cover-image" id="result-cover-img" alt="封面截图">
        <div class="text-content" id="result-cover-text"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Tab: History ───────────────────────── -->
<div id="tab-history" class="tab-content">
  <div class="history-toolbar">
    <input type="text" class="search-box" id="search-input" placeholder="搜索标题/作者…" oninput="renderHistory()">
    <button class="export-btn" onclick="exportExcel()">📥 导出 Excel</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortHistory('title')" data-field="title">标题 <span class="sort-icon">▼</span></th>
          <th onclick="sortHistory('url')" data-field="url">原始链接</th>
          <th onclick="sortHistory('author')" data-field="author">作者</th>
          <th onclick="sortHistory('like_count')" data-field="like_count">点赞量</th>
          <th onclick="sortHistory('created_at')" data-field="created_at">创建时间 <span class="sort-icon">▼</span></th>
          <th onclick="sortHistory('updated_at')" data-field="updated_at">下载时间</th>
          <th onclick="sortHistory('tags')" data-field="tags">标签</th>
          <th>内容总结</th>
          <th>AI总结</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>
  <div class="no-records" id="no-records">暂无下载记录</div>
</div>

<!-- ── Modal ──────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h2 id="modal-title">详情</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════
   State
   ════════════════════════════════════════════════════════ */
let historyData = [];
let sortField = 'created_at';
let sortAsc = false;
let pollingTimer = null;
let currentVideoId = null;

/* ════════════════════════════════════════════════════════
   Tab Switching
   ════════════════════════════════════════════════════════ */
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));
  if (name === 'history') {
    fetchHistory();
  }
}

/* ════════════════════════════════════════════════════════
   Processing
   ════════════════════════════════════════════════════════ */
function startProcess() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) {
    showToast('请输入抖音链接', 'error');
    return;
  }

  const asr = document.getElementById('chk-asr').checked;
  const summary = document.getElementById('chk-summary').checked;

  const btn = document.getElementById('btn-process');
  btn.disabled = true;
  btn.textContent = '处理中…';

  // Show progress
  const progressArea = document.getElementById('progress-area');
  progressArea.classList.add('visible');
  setProgress('正在解析链接…', 10);
  document.getElementById('result-card').classList.remove('visible');

  // Reset polling
  if (pollingTimer) { clearInterval(pollingTimer); pollingTimer = null; }

  fetch('/api/process', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url, asr, summary })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      showToast(data.error, 'error');
      btn.disabled = false;
      btn.textContent = '开始处理';
      progressArea.classList.remove('visible');
      return;
    }
    currentVideoId = data.video_id;
    // Start polling
    pollingTimer = setInterval(() => pollStatus(currentVideoId), 1500);
  })
  .catch(err => {
    showToast('请求失败: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = '开始处理';
    progressArea.classList.remove('visible');
  });
}

function pollStatus(videoId) {
  fetch('/api/history')
    .then(r => r.json())
    .then(items => {
      const item = items.find(i => i.video_id === videoId);
      if (!item) return;

      const status = item.status || '';

      if (status === 'done') {
        clearInterval(pollingTimer);
        pollingTimer = null;
        setProgress('处理完成', 100);
        document.getElementById('btn-process').disabled = false;
        document.getElementById('btn-process').textContent = '开始处理';
        showResultCard(item);
        // Refresh history silently so records stay current
        historyData = items;
        return;
      }

      if (status.startsWith('error')) {
        clearInterval(pollingTimer);
        pollingTimer = null;
        setProgress('处理失败', 100);
        document.getElementById('btn-process').disabled = false;
        document.getElementById('btn-process').textContent = '开始处理';
        showToast('处理失败: ' + status, 'error');
        return;
      }

      // Map status to Chinese and set progress bar
      const msgs = {
        'parsing':      '正在解析链接…',
        'downloading':  '正在下载视频…',
        'downloaded':   '下载完成',
        'transcribing': '正在转写文案…',
        'transcribed':  '转写完成',
        'summarizing':  '正在AI总结…'
      };
      const pctMap = {
        'parsing': 10, 'downloading': 30, 'downloaded': 45,
        'transcribing': 60, 'transcribed': 75, 'summarizing': 85
      };
      setProgress(msgs[status] || status, pctMap[status] || 20);
      // Keep historyData in sync for immediate tab switch
      historyData = items;
    })
    .catch(() => {});
}

function setProgress(text, pct) {
  document.getElementById('progress-text').textContent = '◌ ' + text;
  document.getElementById('progress-bar-inner').style.width = Math.min(pct, 100) + '%';
}

function showResultCard(item) {
  document.getElementById('result-card').classList.add('visible');
  document.getElementById('result-title').textContent = item.title || '(无标题)';
  document.getElementById('result-meta').textContent =
    '👤 ' + (item.author || '未知') + '  ·  ❤ ' + (item.like_count != null ? item.like_count : 0);

  // Video
  const videoUrl = getDownloadUrl(item.video_path);
  const videoEl = document.getElementById('result-video');
  if (videoUrl) {
    videoEl.src = videoUrl;
    videoEl.style.display = 'block';
  } else {
    videoEl.style.display = 'none';
  }

  // Transcript
  document.getElementById('result-transcript').textContent = item.transcript || '(暂无文案)';

  // Summary
  document.getElementById('result-summary').textContent = item.summary || '(暂无总结)';

  // Cover
  const coverUrl = getDownloadUrl(item.screenshot_path);
  const coverImg = document.getElementById('result-cover-img');
  if (coverUrl) {
    coverImg.src = coverUrl;
    coverImg.style.display = 'block';
  } else {
    coverImg.style.display = 'none';
  }
  document.getElementById('result-cover-text').textContent = item.tags || '(暂无分析)';

  // Switch to first pane
  switchCardTab('video');
}

function switchCardTab(name) {
  document.querySelectorAll('.card-tab').forEach(b => b.classList.toggle('active', b.dataset.pane === name));
  document.querySelectorAll('.card-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
}

/* ════════════════════════════════════════════════════════
   History
   ════════════════════════════════════════════════════════ */
function fetchHistory() {
  fetch('/api/history')
    .then(r => r.json())
    .then(items => {
      historyData = items;
      renderHistory();
    })
    .catch(() => showToast('加载记录失败', 'error'));
}

function renderHistory() {
  const search = (document.getElementById('search-input').value || '').trim().toLowerCase();

  let filtered = historyData;
  if (search) {
    filtered = filtered.filter(i =>
      (i.title || '').toLowerCase().includes(search) ||
      (i.author || '').toLowerCase().includes(search)
    );
  }

  // Sort
  filtered.sort((a, b) => {
    let va = a[sortField], vb = b[sortField];
    if (sortField === 'like_count' || sortField === 'created_at' || sortField === 'updated_at') {
      va = Number(va) || 0;
      vb = Number(vb) || 0;
    } else {
      va = (va || '').toString();
      vb = (vb || '').toString();
    }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  // Update sort icons
  document.querySelectorAll('thead th .sort-icon').forEach(el => {
    const th = el.closest('th');
    const field = th ? th.dataset.field : null;
    if (field === sortField) {
      el.textContent = sortAsc ? '▲' : '▼';
      el.classList.add('active');
    } else {
      el.textContent = '▼';
      el.classList.remove('active');
    }
  });

  const tbody = document.getElementById('history-body');
  const noRecords = document.getElementById('no-records');

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    noRecords.style.display = 'block';
    return;
  }
  noRecords.style.display = 'none';

  tbody.innerHTML = filtered.map(item => {
    const title = escHtml(item.title || '');
    const author = escHtml(item.author || '');
    const url = escHtml(item.url || '');
    const like = item.like_count != null ? item.like_count : 0;
    const created = fmtTime(item.created_at);
    const updated = fmtTime(item.updated_at);
    const tags = escHtml(item.tags || '');
    const transcriptPreview = truncateText(item.transcript || '', 100);
    const summaryPreview = truncateText(item.summary || '', 100);
    const hasTranscript = !!(item.transcript && item.transcript.length > 100);
    const hasSummary = !!(item.summary && item.summary.length > 100);

    return `<tr>
      <td><span class="clickable" onclick="showItemDetail(${item.id})">${title}</span></td>
      <td><a class="link" href="${url}" target="_blank" rel="noopener">链接</a></td>
      <td>${author}</td>
      <td>${like}</td>
      <td>${created}</td>
      <td>${updated}</td>
      <td>${tags}</td>
      <td>${transcriptPreview}${hasTranscript ? '<button class="full-btn" onclick="showFullText(' + item.id + ', \'transcript\')">全文</button>' : ''}</td>
      <td>${summaryPreview}${hasSummary ? '<button class="full-btn" onclick="showFullText(' + item.id + ', \'summary\')">全文</button>' : ''}</td>
      <td class="actions">
        <button class="btn-play" onclick="playVideo(${item.id})">▶ 播放</button>
        <button class="btn-del" onclick="deleteItem(${item.id})">删除</button>
      </td>
    </tr>`;
  }).join('');
}

function sortHistory(field) {
  if (sortField === field) {
    sortAsc = !sortAsc;
  } else {
    sortField = field;
    sortAsc = true;
  }
  renderHistory();
}

/* ════════════════════════════════════════════════════════
   Actions (called from history rows)
   ════════════════════════════════════════════════════════ */
function playVideo(itemId) {
  const item = historyData.find(i => i.id === itemId);
  if (!item || !item.video_path) { showToast('视频文件不存在', 'error'); return; }
  const url = getDownloadUrl(item.video_path);
  if (!url) { showToast('视频文件路径无效', 'error'); return; }
  document.getElementById('modal-title').textContent = '▶ 视频播放';
  document.getElementById('modal-body').innerHTML =
    '<video src="' + url.replace(/"/g, '&quot;') + '" controls style="width:100%;max-height:500px;border-radius:6px;"></video>';
  document.getElementById('modal-overlay').classList.add('visible');
}

function showFullText(itemId, field) {
  const item = historyData.find(i => i.id === itemId);
  if (!item) return;
  const titles = { transcript: '文案全文', summary: 'AI总结全文' };
  document.getElementById('modal-title').textContent = titles[field] || '全文';
  document.getElementById('modal-body').textContent = item[field] || '(空)';
  document.getElementById('modal-overlay').classList.add('visible');
}

function showItemDetail(itemId) {
  const item = historyData.find(i => i.id === itemId);
  if (!item) return;
  const detailLines = [
    '标题: ' + (item.title || '(无)'),
    '作者: ' + (item.author || '(无)'),
    '点赞: ' + (item.like_count != null ? item.like_count : 0),
    '链接: ' + (item.url || '(无)'),
    '创建时间: ' + fmtTime(item.created_at),
    '下载时间: ' + fmtTime(item.updated_at),
    '标签: ' + (item.tags || '(无)'),
    '状态: ' + (item.status || '(无)'),
    '',
    '--- 内容总结 ---',
    item.transcript || '(无)',
    '',
    '--- AI总结 ---',
    item.summary || '(无)'
  ];
  document.getElementById('modal-title').textContent = '完整详情';
  document.getElementById('modal-body').textContent = detailLines.join('\n');
  document.getElementById('modal-overlay').classList.add('visible');
}

function deleteItem(id) {
  if (!confirm('确定要删除这条记录吗？相关的本地文件也将被删除。')) return;
  fetch('/api/item/' + id, { method: 'DELETE' })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        showToast('删除成功', 'success');
        fetchHistory();
      } else {
        showToast('删除失败', 'error');
      }
    })
    .catch(() => showToast('删除请求失败', 'error'));
}

function exportExcel() {
  window.location.href = '/api/export';
}

/* ════════════════════════════════════════════════════════
   Utility
   ════════════════════════════════════════════════════════ */
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function truncateText(text, max) {
  if (!text) return '(空)';
  text = escHtml(text);
  if (text.length <= max) return text;
  return text.substring(0, max) + '…';
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function getDownloadUrl(path) {
  if (!path) return null;
  // Strip leading data/downloads/ if present
  let cleaned = path.replace(/^data\/downloads\//, '').replace(/^data\\downloads\\/, '');
  // If the path contains data/downloads/ somewhere (absolute path), extract relative part
  const m = cleaned.match(/data[/\\]downloads[/\\](.+)/);
  if (m) cleaned = m[1];
  return '/download/' + cleaned;
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

function closeModal(e) {
  // If called with an event, only close when clicking the overlay backdrop (not modal content)
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('visible');
  // Stop video when closing modal
  const video = document.querySelector('#modal-body video');
  if (video) { video.pause(); }
}

/* ── Keyboard ─────────────────────────────── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('modal-overlay').classList.remove('visible');
    const video = document.querySelector('#modal-body video');
    if (video) { video.pause(); }
  }
  // Enter in URL input triggers process
  if (e.key === 'Enter' && document.getElementById('tab-process').classList.contains('active')) {
    const input = document.getElementById('url-input');
    if (document.activeElement === input) {
      startProcess();
    }
  }
});
</script>
